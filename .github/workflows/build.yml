name: Build ZEBDA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List files
        run: ls -lh
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Found zip: $ZIP"
          unzip -o "$ZIP"
          ls -lh
          # انقل كل الملفات للجذر
          if [ -d "android-app" ]; then mv android-app/* . -f || true; fi
          if [ -d "zebda-army-android" ]; then mv zebda-army-android/* . -f || true; fi
          # لو فيه مجلد واحد فقط جواه المشروع
          for d in */; do if [ -f "$d/gradlew" ]; then echo "Found gradlew in $d"; cp -r "$d"* .; cp -r "$d".* . 2>/dev/null || true; fi; done
          ls -lh
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --info
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEBDA-Army-APK
          path: app/build/outputs/apk/debug/*.apk
