name: Build ZEBDA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and prepare
        run: |
          unzip -o zebda-army-android.zip || true
          ls -R | head -n 100
          # ابحث عن gradlew وين
          find . -name "gradlew" -type f
          # لو في مجلد android-app انقله للرئيسية
          if [ -d "android-app" ]; then cp -r android-app/* .; fi
          # لو فك الضغط سوى مجلد ثاني
          for d in */; do if [ -f "$d/gradlew" ]; then cp -r "$d"/* .; fi; done
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          ls -la
          find . -name "gradlew"
          chmod +x ./gradlew || chmod +x */gradlew || true
          ./gradlew assembleDebug || (find . -name gradlew -exec chmod +x {} \; -exec {} assembleDebug \;)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEBDA-Army-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
