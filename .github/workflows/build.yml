name: Build ZEBDA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Create Full Android Project
        run: |
          rm -f *.zip
          mkdir -p app/src/main/java/com/zebda/army
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } } allprojects { repositories { google(); mavenCentral() } }" > build.gradle
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.zebda.army'
              compileSdk 34
              defaultConfig { applicationId "com.zebda.army"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:allowBackup="true" android:label="ZEBDA Army" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".ArmyForegroundService" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="ZEBDA Army"/>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/zebda/army/MainActivity.java <<'EOF'
          package com.zebda.army;
          import android.app.Activity; import android.os.Bundle; import android.widget.TextView; import android.view.Gravity;
          public class MainActivity extends Activity {
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("ZEBDA ARMY\n\nجيش الزبدة جاهز 💪🔥");
                  tv.setGravity(Gravity.CENTER); tv.setTextSize(24); tv.setPadding(50,300,50,300);
                  setContentView(tv);
              }
          }
          EOF
          cat > app/src/main/java/com/zebda/army/ArmyForegroundService.java <<'EOF'
          package com.zebda.army;
          import android.app.Service; import android.content.Intent; import android.os.IBinder;
          public class ArmyForegroundService extends Service {
              @Override public IBinder onBind(Intent intent) { return null; }
              @Override public int onStartCommand(Intent intent, int flags, int startId) { return START_STICKY; }
          }
          EOF
          echo '<resources><string name="app_name">ZEBDA Army</string></resources>' > app/src/main/res/values/strings.xml
          echo -e "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          echo -e "#!/bin/sh\nexec java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain \"\$@\"" > gradlew
          chmod +x gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEBDA-Army-APK
          path: app/build/outputs/apk/debug/*.apk
