name: Build ZEBDA APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Create Project
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/zebda/army
          mkdir -p app/src/main/res/values
          echo "include ':app'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.zebda.army'
            compileSdk 34
            defaultConfig { applicationId "com.zebda.army"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:label="ZEBDA Army"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.zebda.army; import android.app.Activity; import android.os.Bundle; import android.widget.TextView; import android.view.Gravity; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); TextView tv=new TextView(this); tv.setText("ZEBDA ARMY\nتم بنجاح!"); tv.setGravity(Gravity.CENTER); tv.setTextSize(24); tv.setPadding(50,300,50,300); setContentView(tv);} }' > app/src/main/java/com/zebda/army/MainActivity.java
          echo '<resources><string name="app_name">ZEBDA Army</string></resources>' > app/src/main/res/values/strings.xml
      - name: Build APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZEBDA-APK
          path: app/build/outputs/apk/debug/*.apk
